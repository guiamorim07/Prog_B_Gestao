name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npx prisma -v
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          